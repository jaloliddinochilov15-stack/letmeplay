<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash - Cyberpunk Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #05050d;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Glow Effects */
        .neon-border-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 2px solid #00f3ff;
        }

        .neon-border-magenta {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border: 2px solid #ff007f;
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .neon-text-magenta {
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(10, 10, 25, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #00f3ff;
            border-radius: 3px;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-slate-950 text-white overflow-hidden select-none">

    <!-- Main Game Container -->
    <div id="game-wrapper" class="relative w-full max-w-5xl aspect-[16/9] max-h-[90vh] bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col">
        
        <!-- Canvas Element -->
        <canvas id="gameCanvas" class="w-full h-full cursor-pointer"></canvas>

        <!-- Overlay: Main Menu -->
        <div id="menu-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-between p-6 z-20 transition-opacity duration-300">
            <!-- Header -->
            <div class="text-center mt-4">
                <h1 class="text-4xl md:text-6xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-400 neon-text-cyan uppercase">
                    GEOMETRY DASH
                </h1>
                <p class="text-xs md:text-sm text-cyan-300 tracking-widest mt-1 uppercase font-semibold">Cyberpunk Rhythm Edition</p>
            </div>

            <!-- Level Selector / Play -->
            <div class="flex flex-col items-center w-full max-w-md gap-4">
                <div class="flex items-center justify-between w-full bg-slate-900/80 p-4 rounded-xl border border-cyan-500/30 neon-border-cyan">
                    <button id="prev-level" class="p-3 bg-slate-800 hover:bg-cyan-500/20 text-cyan-400 rounded-lg transition-all active:scale-95">
                        <i class="fas fa-chevron-left text-xl"></i>
                    </button>
                    <div class="text-center">
                        <div id="level-title" class="font-orbitron text-lg font-bold text-cyan-300">Level 1: Neon Genesis</div>
                        <div id="level-difficulty" class="text-xs text-yellow-400 font-semibold mt-1">★ Normal (1.0x Speed)</div>
                        <div id="level-best" class="text-xs text-slate-400 mt-1">Best Progress: 0%</div>
                    </div>
                    <button id="next-level" class="p-3 bg-slate-800 hover:bg-cyan-500/20 text-cyan-400 rounded-lg transition-all active:scale-95">
                        <i class="fas fa-chevron-right text-xl"></i>
                    </button>
                </div>

                <button id="play-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:from-cyan-400 hover:to-fuchsia-500 text-white font-orbitron font-black text-2xl rounded-xl shadow-lg hover:shadow-cyan-500/50 transition-all duration-200 active:scale-98 flex items-center justify-center gap-3">
                    <i class="fas fa-play"></i> START GAME
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-4 mb-2">
                <button id="editor-btn" class="px-5 py-2.5 bg-slate-800/80 hover:bg-fuchsia-600/30 border border-fuchsia-500/40 text-fuchsia-300 font-bold rounded-lg transition-all flex items-center gap-2 text-sm">
                    <i class="fas fa-tools"></i> Level Editor
                </button>
                <button id="audio-toggle-btn" class="px-5 py-2.5 bg-slate-800/80 hover:bg-cyan-600/30 border border-cyan-500/40 text-cyan-300 font-bold rounded-lg transition-all flex items-center gap-2 text-sm">
                    <i class="fas fa-volume-up" id="audio-icon"></i> Audio: ON
                </button>
            </div>
        </div>

        <!-- Overlay: Editor Tools (Hidden by default) -->
        <div id="editor-toolbar" class="hidden absolute top-0 left-0 right-0 p-3 bg-slate-950/90 border-b border-cyan-500/30 flex flex-wrap items-center justify-between gap-2 z-30">
            <div class="flex items-center gap-2">
                <button id="editor-back-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded text-slate-300 border border-slate-600">
                    <i class="fas fa-arrow-left"></i> Exit
                </button>
                <button id="editor-test-btn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded text-white shadow">
                    <i class="fas fa-play"></i> Test Level
                </button>
                <button id="editor-clear-btn" class="px-3 py-1.5 bg-rose-600/80 hover:bg-rose-500 text-xs font-bold rounded text-white">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>

            <!-- Object Palette -->
            <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-700 overflow-x-auto max-w-full custom-scrollbar">
                <button data-type="spike" class="tool-btn active px-3 py-1 bg-slate-800 hover:bg-cyan-500/30 text-cyan-400 text-xs font-bold rounded border border-cyan-500/50 flex items-center gap-1">
                    ▲ Spike
                </button>
                <button data-type="block" class="tool-btn px-3 py-1 bg-slate-800 hover:bg-cyan-500/30 text-cyan-400 text-xs font-bold rounded border border-slate-700 flex items-center gap-1">
                    █ Block
                </button>
                <button data-type="pad" class="tool-btn px-3 py-1 bg-slate-800 hover:bg-yellow-500/30 text-yellow-400 text-xs font-bold rounded border border-slate-700 flex items-center gap-1">
                    _ Pad (Jump)
                </button>
                <button data-type="portal_ship" class="tool-btn px-3 py-1 bg-slate-800 hover:bg-fuchsia-500/30 text-fuchsia-400 text-xs font-bold rounded border border-slate-700 flex items-center gap-1">
                    ⟐ Ship Portal
                </button>
                <button data-type="portal_cube" class="tool-btn px-3 py-1 bg-slate-800 hover:bg-emerald-500/30 text-emerald-400 text-xs font-bold rounded border border-slate-700 flex items-center gap-1">
                    ⟐ Cube Portal
                </button>
                <button data-type="eraser" class="tool-btn px-3 py-1 bg-slate-800 hover:bg-rose-500/30 text-rose-400 text-xs font-bold rounded border border-slate-700 flex items-center gap-1">
                    ✕ Eraser
                </button>
            </div>
        </div>

        <!-- In-Game HUD -->
        <div id="game-hud" class="hidden absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10 font-orbitron">
            <div class="bg-slate-900/80 px-4 py-2 rounded-lg border border-cyan-500/30 text-cyan-400 font-bold text-sm backdrop-blur">
                PROGRESS: <span id="progress-text" class="text-white">0%</span>
            </div>
            <div id="mode-badge" class="bg-slate-900/80 px-3 py-1 rounded-lg border border-fuchsia-500/30 text-fuchsia-400 font-bold text-xs backdrop-blur uppercase">
                MODE: CUBE
            </div>
        </div>

        <!-- Death Overlay -->
        <div id="death-overlay" class="hidden absolute inset-0 bg-rose-950/40 backdrop-blur-sm flex flex-col items-center justify-center z-20 pointer-events-auto">
            <div class="text-rose-500 font-black font-orbitron text-4xl mb-2 tracking-widest animate-bounce">CRASHED!</div>
            <div id="death-progress" class="text-slate-200 font-bold text-lg mb-6">Attempt 1 • 45%</div>
            <button id="retry-btn" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:from-cyan-400 hover:to-fuchsia-500 font-orbitron font-bold text-lg rounded-xl shadow-lg transition-all active:scale-95">
                TRY AGAIN
            </button>
        </div>
    </div>

    <script>
        // --- AUDIO SYNTHESIZER (Web Audio API) ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.tempo = 128;
                this.nextBeatTime = 0;
                this.beatIndex = 0;
                this.timerId = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playPadJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
            }

            playPortal() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, this.ctx.currentTime + 0.25);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            // Synth Music Loop
            startBgm() {
                if (!this.enabled) return;
                this.init();
                this.stopBgm();
                this.nextBeatTime = this.ctx.currentTime;
                this.beatIndex = 0;
                this.scheduleBeat();
            }

            stopBgm() {
                if (this.timerId) clearTimeout(this.timerId);
            }

            scheduleBeat() {
                if (!this.enabled) return;
                const secondsPerBeat = 60.0 / this.tempo / 4; // 16th notes
                while (this.nextBeatTime < this.ctx.currentTime + 0.1) {
                    this.playSynthStep(this.beatIndex, this.nextBeatTime);
                    this.nextBeatTime += secondsPerBeat;
                    this.beatIndex = (this.beatIndex + 1) % 32;
                }
                this.timerId = setTimeout(() => this.scheduleBeat(), 25);
            }

            playSynthStep(step, time) {
                // Bass synth line
                const bassNotes = [110, 110, 220, 110, 146.83, 110, 164.81, 130.81];
                if (step % 2 === 0) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    const note = bassNotes[Math.floor(step / 4) % bassNotes.length];
                    osc.frequency.setValueAtTime(note, time);

                    gain.gain.setValueAtTime(0.08, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.1);
                }

                // Cyber beat drum
                if (step % 4 === 0) { // Kick
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(120, time);
                    osc.frequency.exponentialRampToValueAtTime(30, time + 0.08);
                    gain.gain.setValueAtTime(0.3, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.08);
                } else if (step % 4 === 2) { // Hi-hat
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'highpass' ? 'square' : 'triangle';
                    osc.frequency.setValueAtTime(8000, time);
                    gain.gain.setValueAtTime(0.03, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.03);
                }
            }
        }

        // --- GAME ENGINE & STATES ---
        const sound = new SoundSystem();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Internal rendering resolution
        const V_WIDTH = 1280;
        const V_HEIGHT = 720;
        const GROUND_Y = V_HEIGHT - 120;
        const GRID_SIZE = 50;

        let gameState = 'MENU'; // MENU, PLAYING, EDITOR, GAMEOVER
        let gameMode = 'cube';  // 'cube' or 'ship'
        let attempts = 1;
        let selectedTool = 'spike';

        // Camera / Scroll
        let cameraX = 0;
        let scrollSpeed = 8.5;

        // Player Configuration
        const player = {
            x: 200,
            y: GROUND_Y - 50,
            w: 50,
            h: 50,
            vy: 0,
            gravity: 1.25,
            jumpForce: -18.5,
            rotation: 0,
            grounded: false,
            dead: false
        };

        // Ship physics override params
        const shipParams = {
            gravity: 0.55,
            thrust: -0.85,
            maxVy: 10
        };

        // Inputs
        const keys = { hold: false };

        // Built-in Levels Data
        const BUILTIN_LEVELS = [
            {
                name: "Level 1: Neon Genesis",
                difficulty: "★ Normal (1.0x)",
                speed: 8.5,
                objects: [
                    { type: 'spike', x: 700, y: GROUND_Y - 50 },
                    { type: 'spike', x: 1100, y: GROUND_Y - 50 },
                    { type: 'block', x: 1400, y: GROUND_Y - 50 },
                    { type: 'spike', x: 1400, y: GROUND_Y - 100 },
                    { type: 'block', x: 1700, y: GROUND_Y - 50 },
                    { type: 'block', x: 1750, y: GROUND_Y - 50 },
                    { type: 'pad', x: 2000, y: GROUND_Y - 15 },
                    { type: 'spike', x: 2200, y: GROUND_Y - 50 },
                    { type: 'spike', x: 2250, y: GROUND_Y - 50 },
                    { type: 'portal_ship', x: 2600, y: GROUND_Y - 150 },
                    { type: 'block', x: 2900, y: GROUND_Y - 150 },
                    { type: 'block', x: 3100, y: GROUND_Y - 250 },
                    { type: 'spike', x: 3400, y: GROUND_Y - 50 },
                    { type: 'portal_cube', x: 3700, y: GROUND_Y - 150 },
                    { type: 'spike', x: 4100, y: GROUND_Y - 50 },
                    { type: 'spike', x: 4150, y: GROUND_Y - 50 },
                    { type: 'spike', x: 4200, y: GROUND_Y - 50 }
                ]
            },
            {
                name: "Level 2: Cyber Overdrive",
                difficulty: "★★ Hard (1.2x)",
                speed: 10.0,
                objects: [
                    { type: 'spike', x: 600, y: GROUND_Y - 50 },
                    { type: 'spike', x: 650, y: GROUND_Y - 50 },
                    { type: 'pad', x: 900, y: GROUND_Y - 15 },
                    { type: 'block', x: 1100, y: GROUND_Y - 150 },
                    { type: 'spike', x: 1100, y: GROUND_Y - 200 },
                    { type: 'portal_ship', x: 1500, y: GROUND_Y - 150 },
                    { type: 'block', x: 1800, y: GROUND_Y - 100 },
                    { type: 'block', x: 2000, y: GROUND_Y - 220 },
                    { type: 'block', x: 2300, y: GROUND_Y - 120 },
                    { type: 'portal_cube', x: 2700, y: GROUND_Y - 150 },
                    { type: 'pad', x: 3000, y: GROUND_Y - 15 },
                    { type: 'spike', x: 3300, y: GROUND_Y - 50 },
                    { type: 'spike', x: 3350, y: GROUND_Y - 50 },
                    { type: 'spike', x: 3400, y: GROUND_Y - 50 }
                ]
            }
        ];

        let currentLevelIdx = 0;
        let activeLevelObjects = [];
        let levelLength = 4500;

        // Visual Particles System
        let particles = [];
        let bgParticles = [];

        function initBgParticles() {
            bgParticles = [];
            for (let i = 0; i < 60; i++) {
                bgParticles.push({
                    x: Math.random() * V_WIDTH,
                    y: Math.random() * V_HEIGHT,
                    size: Math.random() * 3 + 1,
                    speedX: -(Math.random() * 2 + 0.5),
                    color: Math.random() > 0.5 ? '#00f3ff' : '#ff007f'
                });
            }
        }
        initBgParticles();

        function createExplosion(x, y) {
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 2;
                particles.push({
                    x: x + 25,
                    y: y + 25,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 8 + 3,
                    color: ['#00f3ff', '#ff007f', '#ffe600', '#ffffff'][Math.floor(Math.random() * 4)],
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        // --- LEVEL & SAVE SYSTEM ---
        function loadLevel(idx) {
            currentLevelIdx = idx;
            const lvl = BUILTIN_LEVELS[currentLevelIdx];
            activeLevelObjects = JSON.parse(JSON.stringify(lvl.objects));
            scrollSpeed = lvl.speed || 8.5;
            
            // Calculate total level distance
            let maxX = 3000;
            activeLevelObjects.forEach(o => { if (o.x > maxX) maxX = o.x; });
            levelLength = maxX + 800;

            document.getElementById('level-title').innerText = lvl.name;
            document.getElementById('level-difficulty').innerText = lvl.difficulty;

            const best = localStorage.getItem(`gd_best_${currentLevelIdx}`) || 0;
            document.getElementById('level-best').innerText = `Best Progress: ${best}%`;
        }

        // --- RESIZING & CANVAS SCALING ---
        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            canvas.width = V_WIDTH;
            canvas.height = V_HEIGHT;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- GAME LOGIC & CONTROLS ---
        function resetPlayer() {
            player.x = 200;
            player.y = GROUND_Y - 50;
            player.vy = 0;
            player.rotation = 0;
            player.grounded = true;
            player.dead = false;
            cameraX = 0;
            gameMode = 'cube';
            document.getElementById('mode-badge').innerText = 'MODE: CUBE';
        }

        function startGame() {
            sound.init();
            sound.startBgm();
            resetPlayer();
            gameState = 'PLAYING';
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('death-overlay').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');
            document.getElementById('editor-toolbar').classList.add('hidden');
        }

        function triggerDeath() {
            if (player.dead) return;
            player.dead = true;
            sound.playExplosion();
            createExplosion(player.x, player.y);

            const progress = Math.min(100, Math.floor((player.x / levelLength) * 100));
            const bestKey = `gd_best_${currentLevelIdx}`;
            const currentBest = parseInt(localStorage.getItem(bestKey) || '0');
            if (progress > currentBest) {
                localStorage.setItem(bestKey, progress);
            }

            setTimeout(() => {
                document.getElementById('death-progress').innerText = `Attempt ${attempts} • ${progress}%`;
                document.getElementById('death-overlay').classList.remove('hidden');
            }, 600);
        }

        function handleJumpInput() {
            if (gameState !== 'PLAYING' || player.dead) return;

            if (gameMode === 'cube') {
                if (player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                    sound.playJump();
                }
            }
        }

        // --- INPUT EVENT LISTENERS ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (!keys.hold) {
                    handleJumpInput();
                }
                keys.hold = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                keys.hold = false;
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (gameState === 'PLAYING') {
                handleJumpInput();
                keys.hold = true;
            } else if (gameState === 'EDITOR') {
                handleEditorClick(e);
            }
        });

        canvas.addEventListener('mouseup', () => { keys.hold = false; });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') {
                handleJumpInput();
                keys.hold = true;
            }
        });
        canvas.addEventListener('touchend', () => { keys.hold = false; });

        function handleEditorClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = V_WIDTH / rect.width;
            const scaleY = V_HEIGHT / rect.height;

            const clickX = (e.clientX - rect.left) * scaleX + cameraX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Snap to grid
            const gridX = Math.floor(clickX / GRID_SIZE) * GRID_SIZE;
            const gridY = Math.floor(clickY / GRID_SIZE) * GRID_SIZE;

            if (selectedTool === 'eraser') {
                activeLevelObjects = activeLevelObjects.filter(o => 
                    !(Math.abs(o.x - gridX) < 10 && Math.abs(o.y - gridY) < 10)
                );
            } else {
                // Avoid stacking duplicates
                activeLevelObjects = activeLevelObjects.filter(o => 
                    !(Math.abs(o.x - gridX) < 10 && Math.abs(o.y - gridY) < 10)
                );
                activeLevelObjects.push({
                    type: selectedTool,
                    x: gridX,
                    y: gridY
                });
            }
        }

        // --- PHYSICS & UPDATES ---
        function updatePhysics() {
            if (gameState !== 'PLAYING' || player.dead) return;

            // Horizontal Movement
            player.x += scrollSpeed;
            cameraX = player.x - 200;

            // Vertical Movement & Mode Logic
            if (gameMode === 'cube') {
                player.vy += player.gravity;
                player.y += player.vy;

                // Rotation animation in air
                if (!player.grounded) {
                    player.rotation += 8;
                } else {
                    player.rotation = Math.round(player.rotation / 90) * 90;
                }

                // Ground Collision
                if (player.y >= GROUND_Y - player.h) {
                    player.y = GROUND_Y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                }

                // Continuous jump on hold
                if (keys.hold && player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                    sound.playJump();
                }

            } else if (gameMode === 'ship') {
                if (keys.hold) {
                    player.vy += shipParams.thrust;
                } else {
                    player.vy += shipParams.gravity;
                }

                // Cap max velocity
                player.vy = Math.max(-shipParams.maxVy, Math.min(shipParams.maxVy, player.vy));
                player.y += player.vy;

                // Angle based on velocity
                player.rotation = player.vy * 3;

                // Ceiling / Ground Boundaries
                if (player.y <= 0) {
                    player.y = 0;
                    player.vy = 0;
                }
                if (player.y >= GROUND_Y - player.h) {
                    player.y = GROUND_Y - player.h;
                    player.vy = 0;
                }
            }

            // Obstacle & Object Collisions
            const pBox = { x: player.x + 6, y: player.y + 6, w: player.w - 12, h: player.h - 12 };

            activeLevelObjects.forEach(obj => {
                // Spike Collision
                if (obj.type === 'spike') {
                    const sBox = { x: obj.x + 10, y: obj.y + 15, w: 30, h: 35 };
                    if (checkAABB(pBox, sBox)) {
                        triggerDeath();
                    }
                }

                // Block Collision
                else if (obj.type === 'block') {
                    const bBox = { x: obj.x, y: obj.y, w: GRID_SIZE, h: GRID_SIZE };
                    if (checkAABB(pBox, bBox)) {
                        // Top collision (landing)
                        if (player.vy >= 0 && (player.y + player.h - player.vy) <= obj.y + 15) {
                            player.y = obj.y - player.h;
                            player.vy = 0;
                            player.grounded = true;
                        } else {
                            // Side or bottom crash
                            triggerDeath();
                        }
                    }
                }

                // Pad Jump
                else if (obj.type === 'pad') {
                    const padBox = { x: obj.x, y: obj.y, w: GRID_SIZE, h: GRID_SIZE };
                    if (checkAABB(pBox, padBox)) {
                        player.vy = player.jumpForce * 1.35;
                        player.grounded = false;
                        sound.playPadJump();
                    }
                }

                // Portals
                else if (obj.type === 'portal_ship' && gameMode !== 'ship') {
                    if (checkAABB(pBox, { x: obj.x, y: obj.y, w: GRID_SIZE, h: GRID_SIZE * 2 })) {
                        gameMode = 'ship';
                        document.getElementById('mode-badge').innerText = 'MODE: SHIP';
                        sound.playPortal();
                    }
                }
                else if (obj.type === 'portal_cube' && gameMode !== 'cube') {
                    if (checkAABB(pBox, { x: obj.x, y: obj.y, w: GRID_SIZE, h: GRID_SIZE * 2 })) {
                        gameMode = 'cube';
                        document.getElementById('mode-badge').innerText = 'MODE: CUBE';
                        sound.playPortal();
                    }
                }
            });

            // Update Progress HUD
            const currentPct = Math.min(100, Math.floor((player.x / levelLength) * 100));
            document.getElementById('progress-text').innerText = `${currentPct}%`;

            // Win Condition
            if (player.x >= levelLength) {
                const bestKey = `gd_best_${currentLevelIdx}`;
                localStorage.setItem(bestKey, 100);
                alert("LEVEL COMPLETED! GRAND VICTORY!");
                gameState = 'MENU';
                sound.stopBgm();
                document.getElementById('menu-overlay').classList.remove('hidden');
                document.getElementById('game-hud').classList.add('hidden');
            }
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.w &&
                   a.x + a.w > b.x &&
                   a.y < b.y + b.h &&
                   a.y + a.h > b.y;
        }

        // --- RENDERING PIPELINE ---
        function drawBackground() {
            // Dark Neon Gradient Background
            const bgGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
            bgGrad.addColorStop(0, '#04040d');
            bgGrad.addColorStop(0.7, '#0a0a20');
            bgGrad.addColorStop(1, '#150520');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            // Parallax Grid Lines
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.lineWidth = 1;
            const gridOffset = (cameraX * 0.3) % 60;
            for (let x = -gridOffset; x < V_WIDTH; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, V_HEIGHT);
                ctx.stroke();
            }

            // Floating Cyber Particles
            bgParticles.forEach(p => {
                p.x += p.speedX;
                if (p.x < 0) p.x = V_WIDTH;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.4;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;
        }

        function drawGround() {
            // Neon Ground Plane
            ctx.fillStyle = '#090918';
            ctx.fillRect(0, GROUND_Y, V_WIDTH, V_HEIGHT - GROUND_Y);

            // Glowing Top Floor Line
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#00f3ff';
            ctx.fillRect(0, GROUND_Y, V_WIDTH, 4);
            ctx.shadowBlur = 0;

            // Ground Grid Pattern Scrolling
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            const groundOffset = cameraX % 50;
            for (let x = -groundOffset; x < V_WIDTH; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x - 30, V_HEIGHT);
                ctx.stroke();
            }
        }

        function drawObjects() {
            activeLevelObjects.forEach(obj => {
                const drawX = obj.x - cameraX;
                // Only render visible elements
                if (drawX < -100 || drawX > V_WIDTH + 100) return;

                ctx.save();
                ctx.translate(drawX, obj.y);

                if (obj.type === 'spike') {
                    // Glowing Magenta Spike
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#ff007f';
                    ctx.beginPath();
                    ctx.moveTo(25, 0);
                    ctx.lineTo(50, 50);
                    ctx.lineTo(0, 50);
                    ctx.closePath();
                    ctx.fill();

                    // Inner detail
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(25, 12);
                    ctx.lineTo(40, 45);
                    ctx.lineTo(10, 45);
                    ctx.closePath();
                    ctx.fill();
                }

                else if (obj.type === 'block') {
                    // Cyan Block
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 8;
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 3;
                    ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
                    ctx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);
                    ctx.strokeRect(0, 0, GRID_SIZE, GRID_SIZE);

                    // Cross pattern inside block
                    ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(GRID_SIZE, GRID_SIZE);
                    ctx.moveTo(GRID_SIZE, 0); ctx.lineTo(0, GRID_SIZE);
                    ctx.stroke();
                }

                else if (obj.type === 'pad') {
                    // Yellow Jump Pad
                    ctx.shadowColor = '#ffe600';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#ffe600';
                    ctx.fillRect(5, 35, 40, 15);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(12, 40, 26, 5);
                }

                else if (obj.type === 'portal_ship') {
                    // Magenta Portal
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 15;
                    ctx.strokeStyle = '#ff007f';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(10, 0, 30, 100);
                    ctx.fillStyle = 'rgba(255, 0, 127, 0.3)';
                    ctx.fillRect(10, 0, 30, 100);
                }

                else if (obj.type === 'portal_cube') {
                    // Emerald Portal
                    ctx.shadowColor = '#10b981';
                    ctx.shadowBlur = 15;
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(10, 0, 30, 100);
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
                    ctx.fillRect(10, 0, 30, 100);
                }

                ctx.restore();
            });
        }

        function drawPlayer() {
            if (player.dead) return;

            const drawX = player.x - cameraX;
            ctx.save();
            ctx.translate(drawX + player.w / 2, player.y + player.h / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            if (gameMode === 'cube') {
                // Neon Cube Character
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);

                // Inner Face Design
                ctx.fillStyle = '#050515';
                ctx.fillRect(-player.w / 4, -player.h / 4, player.w / 2, player.h / 2);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-player.w / 6, -player.h / 6, player.w / 3, player.h / 3);
            } else {
                // Neon Rocket Ship Mode
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff007f';

                // Rocket Body Triangle
                ctx.beginPath();
                ctx.moveTo(player.w / 2, 0);
                ctx.lineTo(-player.w / 2, -player.h / 2);
                ctx.lineTo(-player.w / 4, 0);
                ctx.lineTo(-player.w / 2, player.h / 2);
                ctx.closePath();
                ctx.fill();

                // Thruster Flame
                if (keys.hold) {
                    ctx.fillStyle = '#ffe600';
                    ctx.beginPath();
                    ctx.moveTo(-player.w / 2, -10);
                    ctx.lineTo(-player.w / 2 - 20, 0);
                    ctx.lineTo(-player.w / 2, 10);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
                    ctx.restore();
                }
            });
        }

        function drawEditorGrid() {
            if (gameState !== 'EDITOR') return;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;

            const startX = Math.floor(cameraX / GRID_SIZE) * GRID_SIZE;
            for (let x = startX; x < cameraX + V_WIDTH; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x - cameraX, 0);
                ctx.lineTo(x - cameraX, GROUND_Y);
                ctx.stroke();
            }

            for (let y = 0; y < GROUND_Y; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(V_WIDTH, y);
                ctx.stroke();
            }
        }

        // --- MAIN GAME LOOP ---
        function gameLoop() {
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            if (gameState === 'PLAYING') {
                updatePhysics();
            } else if (gameState === 'EDITOR') {
                // Camera scroll controls in editor
                if (keys.hold) {
                    // Optional smooth editor pan logic
                }
            }

            drawBackground();
            drawEditorGrid();
            drawGround();
            drawObjects();
            drawPlayer();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        // --- UI INTERACTION HANDLERS ---
        document.getElementById('play-btn').addEventListener('click', () => {
            attempts = 1;
            startGame();
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            attempts++;
            startGame();
        });

        document.getElementById('prev-level').addEventListener('click', () => {
            currentLevelIdx = (currentLevelIdx - 1 + BUILTIN_LEVELS.length) % BUILTIN_LEVELS.length;
            loadLevel(currentLevelIdx);
        });

        document.getElementById('next-level').addEventListener('click', () => {
            currentLevelIdx = (currentLevelIdx + 1) % BUILTIN_LEVELS.length;
            loadLevel(currentLevelIdx);
        });

        document.getElementById('audio-toggle-btn').addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            document.getElementById('audio-icon').className = sound.enabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
            document.getElementById('audio-toggle-btn').innerText = sound.enabled ? ' Audio: ON' : ' Audio: OFF';
            if (!sound.enabled) sound.stopBgm();
        });

        // Editor UI actions
        document.getElementById('editor-btn').addEventListener('click', () => {
            gameState = 'EDITOR';
            resetPlayer();
            cameraX = 0;
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('editor-toolbar').classList.remove('hidden');
        });

        document.getElementById('editor-back-btn').addEventListener('click', () => {
            gameState = 'MENU';
            document.getElementById('editor-toolbar').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
        });

        document.getElementById('editor-test-btn').addEventListener('click', () => {
            attempts = 1;
            startGame();
        });

        document.getElementById('editor-clear-btn').addEventListener('click', () => {
            if (confirm("Clear all placed objects in editor?")) {
                activeLevelObjects = [];
            }
        });

        // Tool Selection
        const toolBtns = document.querySelectorAll('.tool-btn');
        toolBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                toolBtns.forEach(b => b.classList.remove('active', 'border-cyan-500', 'bg-cyan-500/30'));
                const target = e.currentTarget;
                selectedTool = target.getAttribute('data-type');
                target.classList.add('active', 'border-cyan-500', 'bg-cyan-500/30');
            });
        });

        // INITIALIZATION
        window.onload = function() {
            loadLevel(0);
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
